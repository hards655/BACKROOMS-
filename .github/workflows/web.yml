name: Build and deploy BACKROOMS Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ -d "$HOME/.local/share/godot/templates/4.3.stable" ]; then
            cp -a "$HOME/.local/share/godot/templates/4.3.stable/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi
          if [ ! -s "$HOME/.local/share/godot/export_templates/4.3.stable/web_release.zip" ]; then
            wget -q -O /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/web_release.zip"

      - name: Validate project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 2

      - name: Export browser game
        run: |
          set -euxo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f %k KB\n'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
