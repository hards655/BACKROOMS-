name: Build BACKROOMS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      HOME: /root
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Godot Android export toolchain
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          test -d "$ANDROID_HOME"
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" build
          if [ -d "$HOME/.local/share/godot/templates/4.3.stable" ]; then
            cp -a "$HOME/.local/share/godot/templates/4.3.stable/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi
          if [ ! -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk" ]; then
            wget -q -O /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/debug.keystore" || test -s "$HOME/.android/debug.keystore"
          java -version
          ls -la "$HOME/.config/godot"

      - name: Import project and validate main scene
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 2

      - name: Export debug APK (arm64-v8a)
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --export-debug "Android" build/BACKROOMS.apk
          test -s build/BACKROOMS.apk
          file build/BACKROOMS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BACKROOMS-LEVEL-0-Android-APK
          path: build/BACKROOMS.apk
          if-no-files-found: error
          retention-days: 14
